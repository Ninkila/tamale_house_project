services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tamale_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tamale_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tamale_house_market}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tamale_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tamale_user} -d ${POSTGRES_DB:-tamale_house_market}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tamale_postgres_data:
