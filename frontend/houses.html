<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Rental Houses | Tamale House Market</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- NAVIGATION BAR -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Tamale House <span class="gold">Market</span></span>
      </a>

      <nav class="nav-menu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="houses.html" class="nav-link active">Browse Houses</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline btn-sm">Login</a>
        <a href="register.html" class="btn btn-primary btn-sm">Register</a>
        <a href="register.html?role=landlord" class="btn btn-accent btn-sm">List Your Property</a>
      </div>

      <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    </div>
  </header>

  <main class="main-content section">
    <div class="container">
      <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2.2rem; font-weight: 800; color: var(--primary);">Available Rental Houses in Tamale</h1>
        <p style="color: var(--text-muted); font-size: 1rem;">Filter verified properties by location, rent budget, and amenities</p>
      </div>

      <!-- FILTER TOOLBAR CARD -->
      <div class="search-card" style="margin-bottom: 2.5rem; max-width: 100%;">
        <form id="houses-filter-form" class="search-grid">
          <div class="form-group">
            <label for="filter-neighborhood">Neighbourhood</label>
            <input type="text" id="filter-neighborhood" class="form-control" placeholder="e.g. Nyohini, Vittin, Dungu" />
          </div>

          <div class="form-group">
            <label for="filter-min-rent">Min Rent (GH₵)</label>
            <input type="number" id="filter-min-rent" class="form-control" placeholder="Min GH₵" />
          </div>

          <div class="form-group">
            <label for="filter-max-rent">Max Rent (GH₵)</label>
            <input type="number" id="filter-max-rent" class="form-control" placeholder="Max GH₵" />
          </div>

          <div class="form-group">
            <label for="filter-rooms">Rooms</label>
            <select id="filter-rooms" class="form-select">
              <option value="0">Any Rooms</option>
              <option value="1">1+ Room</option>
              <option value="2">2+ Rooms</option>
              <option value="3">3+ Rooms</option>
              <option value="4">4+ Rooms</option>
            </select>
          </div>

          <div class="form-group">
            <label for="filter-bathrooms">Bathrooms</label>
            <select id="filter-bathrooms" class="form-select">
              <option value="0">Any Bathrooms</option>
              <option value="1">1+ Bathroom</option>
              <option value="2">2+ Bathrooms</option>
              <option value="3">3+ Bathrooms</option>
            </select>
          </div>

          <div class="form-group" style="display:flex; gap:0.5rem;">
            <button type="submit" class="btn btn-primary" style="flex:1;">Filter</button>
            <button type="button" id="btn-reset-filters" class="btn btn-outline">Reset</button>
          </div>
        </form>
      </div>

      <!-- MATCH COUNTER -->
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.5rem;">
        <div id="filter-count-badge" style="font-weight: 700; color: var(--primary); font-size: 1.1rem;">
          Showing properties...
        </div>
      </div>

      <!-- PROPERTIES GRID -->
      <div class="properties-grid" id="browse-houses-grid">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 Tamale House Market. All rights reserved.</p>
        <p>Tamale, Ghana</p>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/houses.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const urlNeighborhood = urlParams.get('neighborhood') || '';
      const urlHouseType = urlParams.get('houseType') || '';
      const urlMaxRent = urlParams.get('maxRent') || '';
      const urlRooms = urlParams.get('rooms') || '0';

      if (urlNeighborhood) document.getElementById('filter-neighborhood').value = urlNeighborhood;
      if (urlMaxRent) document.getElementById('filter-max-rent').value = urlMaxRent;
      if (urlRooms) document.getElementById('filter-rooms').value = urlRooms;

      const houses = getHousesData();
      applyFiltersAndRender(houses);

      const filterForm = document.getElementById('houses-filter-form');
      filterForm.addEventListener('submit', (e) => {
        e.preventDefault();
        applyFiltersAndRender(houses);
      });

      document.getElementById('btn-reset-filters').addEventListener('click', () => {
        filterForm.reset();
        applyFiltersAndRender(houses);
      });
    });

    function applyFiltersAndRender(houses) {
      const criteria = {
        neighborhood: document.getElementById('filter-neighborhood').value,
        minRent: document.getElementById('filter-min-rent').value,
        maxRent: document.getElementById('filter-max-rent').value,
        rooms: document.getElementById('filter-rooms').value,
        bathrooms: document.getElementById('filter-bathrooms').value
      };

      const filtered = filterHouses(houses, criteria);
      const grid = document.getElementById('browse-houses-grid');
      const countBadge = document.getElementById('filter-count-badge');

      countBadge.textContent = `Showing ${filtered.length} matching property ${filtered.length === 1 ? 'listing' : 'listings'}`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg>
            <h3>No Properties Found</h3>
            <p>No rental properties match your selected search criteria in Tamale. Try adjusting your budget range or selecting a different neighbourhood.</p>
          </div>
        `;
      } else {
        grid.innerHTML = filtered.map(h => renderHouseCard(h)).join('');
      }
    }
  </script>
</body>
</html>
