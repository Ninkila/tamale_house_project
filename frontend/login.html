<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Tamale House Market</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background: linear-gradient(135deg, rgba(11, 29, 58, 0.92) 0%, rgba(6, 17, 36, 0.96) 100%), url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;">

  <!-- NAVIGATION BAR -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Tamale House <span class="gold">Market</span></span>
      </a>

      <nav class="nav-menu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="houses.html" class="nav-link">Browse Houses</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>

      <div class="nav-actions">
        <a href="register.html" class="btn btn-accent btn-sm">Register</a>
      </div>
    </div>
  </header>

  <main class="main-content section" style="display:flex; align-items:center; justify-content:center;">
    <div class="container">
      <div style="max-width: 460px; margin: 0 auto; background: #FFFFFF; padding: 2.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
        
        <div style="text-align: center; margin-bottom: 2rem;">
          <h2 style="font-size: 1.8rem; font-weight: 800; color: var(--primary);">Welcome Back</h2>
          <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem;">Sign in to access your Tamale House Market portal</p>
        </div>

        <div id="login-error" class="alert alert-warning" style="display:none;"></div>

        <form id="login-form" style="display:flex; flex-direction:column; gap:1.25rem;">
          <div class="form-group">
            <label for="login-username">Username or Email</label>
            <input type="text" id="login-username" class="form-control" required placeholder="Enter username or email" />
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" class="form-control" required placeholder="Enter password" />
          </div>

          <button type="submit" class="btn btn-primary btn-lg btn-full" style="margin-top:0.5rem;">
            Login to Marketplace
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-muted);">
          Don't have an account? <a href="register.html" style="font-weight: 700; color: var(--primary);">Register Now</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
