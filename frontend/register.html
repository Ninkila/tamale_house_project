<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account | Tamale House Market</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .role-select-card {
      border: 2px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      cursor: pointer;
      transition: all var(--transition-fast);
      background-color: #FAFAFA;
      text-align: left;
    }
    .role-select-card:hover {
      border-color: var(--accent);
      background-color: #FFF;
    }
    .role-select-card.selected-role {
      border-color: var(--primary);
      background-color: rgba(11, 29, 58, 0.05);
      box-shadow: 0 0 0 2px var(--primary);
    }
  </style>
</head>
<body style="background: linear-gradient(135deg, rgba(11, 29, 58, 0.92) 0%, rgba(6, 17, 36, 0.96) 100%), url('https://images.unsplash.com/photo-1570129477492-45c003edd2be?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;">

  <!-- NAVIGATION BAR -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Tamale House <span class="gold">Market</span></span>
      </a>

      <nav class="nav-menu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="houses.html" class="nav-link">Browse Houses</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline btn-sm">Login</a>
      </div>
    </div>
  </header>

  <main class="main-content section">
    <div class="container">
      <div style="max-width: 580px; margin: 0 auto; background: #FFFFFF; padding: 2.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
        
        <div style="text-align: center; margin-bottom: 2rem;">
          <h2 style="font-size: 1.8rem; font-weight: 800; color: var(--primary);">Create Your Account</h2>
          <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem;">Join Tamale House Market as a landlord or prospective tenant</p>
        </div>

        <div id="register-error" class="alert alert-warning" style="display:none;"></div>

        <form id="register-form" style="display:flex; flex-direction:column; gap:1.25rem;">
          
          <!-- ROLE SELECTION HEADER -->
          <div>
            <label style="font-weight: 700; color: var(--primary); font-size: 0.95rem; display:block; margin-bottom:0.75rem;">
              How would you like to use Tamale House Market?
            </label>
            <input type="hidden" id="register-role" value="tenant" />
            
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
              <!-- OPTION 1: LANDLORD -->
              <div class="role-select-card" id="role-landlord">
                <div style="font-weight: 800; color: var(--primary); font-size: 1rem; margin-bottom: 0.25rem;">LANDLORD</div>
                <div style="font-size: 0.8rem; color: var(--text-muted);">"I want to list and manage rental properties."</div>
              </div>

              <!-- OPTION 2: TENANT -->
              <div class="role-select-card selected-role" id="role-tenant">
                <div style="font-weight: 800; color: var(--primary); font-size: 1rem; margin-bottom: 0.25rem;">TENANT</div>
                <div style="font-size: 0.8rem; color: var(--text-muted);">"I'm looking for a house to rent."</div>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="reg-fullname">Full Name</label>
            <input type="text" id="reg-fullname" class="form-control" required placeholder="e.g. Fareed Mahama" />
          </div>

          <div class="form-group">
            <label for="reg-email">Email Address</label>
            <input type="email" id="reg-email" class="form-control" required placeholder="name@example.com" />
          </div>

          <div class="form-group">
            <label for="reg-username">Username</label>
            <input type="text" id="reg-username" class="form-control" required placeholder="Choose a unique username" />
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label for="reg-password">Password</label>
              <input type="password" id="reg-password" class="form-control" required placeholder="Min 6 characters" />
            </div>

            <div class="form-group">
              <label for="reg-confirm-password">Confirm Password</label>
              <input type="password" id="reg-confirm-password" class="form-control" required placeholder="Confirm password" />
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg btn-full" style="margin-top:0.5rem;">
            Complete Registration
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-muted);">
          Already registered? <a href="login.html" style="font-weight: 700; color: var(--primary);">Log In Here</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roleParam = urlParams.get('role');
      if (roleParam === 'landlord') {
        const landlordBtn = document.getElementById('role-landlord');
        if (landlordBtn) landlordBtn.click();
      }
    });
  </script>
</body>
</html>
