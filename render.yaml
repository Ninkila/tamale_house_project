services:
  - type: web
    name: tamale-house-market
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tamale-house-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: tamale-house-db
    databaseName: tamale_house_market
    user: tamale_user
    plan: free
